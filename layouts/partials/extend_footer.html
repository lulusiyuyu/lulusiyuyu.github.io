<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Select elements that should have the Apple-style fade-up animation
        const elementsToAnimate = document.querySelectorAll(
            '.post-entry, .profile_inner, .post-content > p, .post-content > h1, .post-content > h2, .post-content > h3, .post-content > ul, .page-header, .footer, .home-about-section .post-content > *'
        );

        // Add the starting state class to all identified elements
        elementsToAnimate.forEach(el => {
            el.classList.add('fade-up');
        });

        // Intersection Observer to trigger the animation when scrolled into view
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Add tiny delay for staggered effect when multiple elements appear at once
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, 50);

                    // Stop observing once animated
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.05,
            rootMargin: "0px 0px -40px 0px"
        });

        // Start observing
        elementsToAnimate.forEach(el => {
            observer.observe(el);
        });
    });
</script>
