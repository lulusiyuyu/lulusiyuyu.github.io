<script>
/* ============================================================
   Scroll Reveal + Scroll Progress — Performant, no deps
   ============================================================ */
(function () {
  'use strict';

  /* ── Scroll progress bar ── */
  const bar = document.createElement('div');
  bar.id = 'scroll-progress';
  document.body.prepend(bar);

  function updateProgress() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    bar.style.width = pct.toFixed(2) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });

  /* ── Scroll Reveal via IntersectionObserver ── */
  const targets = [
    '.post-entry',
    '.profile',
    '.home-info',
    'article > *',
    '.toc',
    '.post-tags',
  ];

  function initReveal() {
    const elements = document.querySelectorAll(targets.join(','));

    // skip tiny viewports (mobile perf concern)
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target); // fire once only
          }
        });
      },
      {
        root: null,
        rootMargin: '0px 0px -60px 0px', // trigger slightly before fully in view
        threshold: 0.1,
      }
    );

    elements.forEach((el) => {
      el.classList.add('reveal');
      observer.observe(el);
    });
  }

  /* ── Subtle cursor-tracking glow on cards ── */
  function initCardGlow() {
    document.querySelectorAll('.post-entry').forEach((card) => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--gx', x + '%');
        card.style.setProperty('--gy', y + '%');
      });
    });
  }

  /* For card glow: add CSS custom prop radial gradient */
  const styleEl = document.createElement('style');
  styleEl.textContent = `
    .post-entry {
      background-image: radial-gradient(
        circle at var(--gx, 50%) var(--gy, 50%),
        rgba(99,179,237,0.06) 0%,
        transparent 60%
      );
    }
  `;
  document.head.appendChild(styleEl);

  /* ── Run on DOM ready ── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initReveal();
      initCardGlow();
    });
  } else {
    initReveal();
    initCardGlow();
  }
})();
</script>
