{{ if or .Params.math .Site.Params.math }}
<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
    integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6vV3FZXZ0cinmKABKqyBhz00TwlHK"
    crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+O80333mIB2rswkB01vQ"
    crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderMathInElement(document.body, {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false
        });
    });
</script>
{{ end }}

{{ if or .Params.mermaid .Site.Params.mermaid }}
<!-- Mermaid JS -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
        startOnLoad: false,
        theme: (document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default'),
        securityLevel: 'loose'
    });

    document.addEventListener("DOMContentLoaded", function () {
        const mermaidElements = document.querySelectorAll('.language-mermaid');
        if (mermaidElements.length > 0) {
            mermaidElements.forEach(el => {
                // Hugo wraps code in <pre><code>, mermaid needs the text content. We replace it.
                const preNode = el.parentNode;
                const mermaidDiv = document.createElement('div');
                mermaidDiv.classList.add('mermaid');
                mermaidDiv.textContent = el.textContent;
                preNode.parentNode.replaceChild(mermaidDiv, preNode);
            });
            mermaid.run({ querySelector: '.mermaid' });
        }
    });
</script>
{{ end }}
